name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Interim github.io project-page deploy. Remove both lines once the custom
      # domain mhpharmapack.com is configured in Pages settings and DNS is live;
      # astro.config.mjs then falls back to the production site and base '/'.
      SITE_URL: https://mh-pharmapack.github.io
      BASE_PATH: /Website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
