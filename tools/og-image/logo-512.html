<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  /* Google's logo guidance: it must read correctly on a purely white
     background, and the format has to be one Google Images supports, which
     rules out the brand SVG. Pure white, generous padding, mark centred. */
  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img { width: 424px; height: auto; display: block; }
</style>
</head>
<body>
  <img src="../../src/assets/logo/mh-pharmapack-logo.svg" alt="">
</body>
</html>
